# Add 'branding' label to any changes within 'docs' folder or any subfolders
branding:
- changed-files:
  - any-glob-to-any-file: branding/**

# Add 'docs' label to any change to .md files within the entire repository 
docs:
- changed-files:
  - any-glob-to-any-file: '**/*.md'

# Add 'enhancement' label to any change to src files within the source dir EXCEPT for the docs sub-folder
enhancement:
  - changed-files:
    - any-glob-to-any-file: 'src/**/*'
    - any-glob-to-any-file: 'config.schema.json'

# Add 'dependencies' label to any change to src files within the source dir EXCEPT for the docs sub-folder
dependencies:
  - changed-files:
    - any-glob-to-any-file: 'package.json'
    - any-glob-to-any-file: 'package-lock.json'

# Add 'beta' label to any PR that is opened against the `beta` branch
beta:
- base-branch: 'beta*'

# Add 'alpha' label to any PR that is opened against the `alpha` branch
alpha:
- base-branch: 'alpha*'

# Add 'latest' label to any PR that is opened against the `latest` branch
latest:
- base-branch: 'latest'

# Add 'workflow' to any changes within 'workflow' folder or any subfolders
workflow:
- changed-files:
  - any-glob-to-any-file: .github/**

# Semantic versioning labels for Copilot workflow
# These labels determine the type of version bump and target beta branch

# Add 'patch' label for bug fixes (X.Y.Z -> X.Y.Z+1)
# Should be manually assigned to issues representing bug fixes
patch:
- changed-files:
  - any-glob-to-any-file: '!**/*'  # Never auto-assigned, must be manual

# Add 'minor' label for new features (X.Y.Z -> X.Y+1.0)  
# Should be manually assigned to issues representing new features
minor:
- changed-files:
  - any-glob-to-any-file: '!**/*'  # Never auto-assigned, must be manual

# Add 'major' label for breaking changes (X.Y.Z -> X+1.0.0)
# Should be manually assigned to issues representing breaking changes  
major:
- changed-files:
  - any-glob-to-any-file: '!**/*'  # Never auto-assigned, must be manual