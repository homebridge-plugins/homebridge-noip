name: Copilot Branch Management

on:
  issues:
    types: [assigned, labeled]
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  enforce-copilot-rules:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.assignees.*.login, 'copilot') || contains(github.event.pull_request.assignees.*.login, 'copilot')
    
    steps:
    - name: Check for semantic version label
      if: github.event_name == 'issues'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: issue } = await github.rest.issues.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number
          });
          
          const semverLabels = ['patch', 'minor', 'major'];
          const hasVersionLabel = issue.labels.some(label => 
            semverLabels.includes(label.name)
          );
          
          if (!hasVersionLabel) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **Copilot Assignment Error**: This issue must have one semantic versioning label (`patch`, `minor`, or `major`) before it can be assigned to Copilot.\n\nPlease add the appropriate label based on the type of change:\n- `patch`: Bug fixes (backward compatible)\n- `minor`: New features (backward compatible)\n- `major`: Breaking changes\n\nOnce labeled, you can re-assign to Copilot.'
            });
            
            // Unassign copilot
            await github.rest.issues.removeAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: ['copilot']
            });
            
            throw new Error('Issue must have semantic versioning label before Copilot assignment');
          }

    - name: Check PR target branch
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          const baseBranch = pr.base.ref;
          
          // Check if PR targets a beta branch or latest
          const isBetaBranch = baseBranch.startsWith('beta-') || baseBranch === 'beta';
          const isLatestBranch = baseBranch === 'latest';
          
          if (!isBetaBranch && !isLatestBranch) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: '⚠️ **Invalid Target Branch**: Copilot PRs must target a beta branch first.\n\nPlease change the base branch to:\n- An existing `beta-X.Y.Z` branch, or\n- The `beta` branch if no version-specific branch exists\n\nOnly after beta testing should changes be merged to `latest`.'
            });
            
            throw new Error('PR must target beta branch first');
          }
          
          if (isBetaBranch) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: '✅ **Correct Target Branch**: This PR correctly targets a beta branch for testing before production release.'
            });
          }

  create-beta-branch:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && contains(github.event.issue.assignees.*.login, 'copilot')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Create beta branch if needed
      uses: actions/github-script@v7
      with:
        script: |
          const { data: issue } = await github.rest.issues.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number
          });
          
          // Get version label
          const versionLabel = issue.labels.find(label => 
            ['patch', 'minor', 'major'].includes(label.name)
          )?.name;
          
          if (!versionLabel) return;
          
          // Read current version from package.json
          const { data: packageFile } = await github.rest.repos.getContent({
            owner: context.repo.owner,
            repo: context.repo.repo,
            path: 'package.json'
          });
          
          const packageJson = JSON.parse(Buffer.from(packageFile.content, 'base64').toString());
          const currentVersion = packageJson.version;
          const [major, minor, patch] = currentVersion.split('.').map(Number);
          
          // Calculate next version
          let nextVersion;
          switch (versionLabel) {
            case 'patch':
              nextVersion = `${major}.${minor}.${patch + 1}`;
              break;
            case 'minor':
              nextVersion = `${major}.${minor + 1}.0`;
              break;
            case 'major':
              nextVersion = `${major + 1}.0.0`;
              break;
          }
          
          const betaBranchName = `beta-${nextVersion}`;
          
          // Check if beta branch already exists
          try {
            await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: betaBranchName
            });
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **Beta Branch Ready**: The \`${betaBranchName}\` branch already exists and is ready for development.`
            });
            
          } catch (error) {
            if (error.status === 404) {
              // Branch doesn't exist, create it
              const { data: latestBranch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'latest'
              });
              
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${betaBranchName}`,
                sha: latestBranch.commit.sha
              });
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `✅ **Beta Branch Created**: Created \`${betaBranchName}\` branch for this ${versionLabel} release.\n\nCopilot should target this branch for all pull requests related to this issue.`
              });
            } else {
              throw error;
            }
          }